<form method="post" enctype="multipart/form-data" class="attachment-form">
  {% csrf_token %}
  <label for="attachment-file">Акт, файл хавсаргах</label>
  <input type="file" id="attachment-file" name="attachment" required aria-label="Акт, файл хавсаргах" aria-describedby="attachment-help">
  <small id="attachment-help">Бүх төрлийн файл сонгож болно. Нэвтэрсэн бүх хэрэглэгч харах боломжтой.</small>
  <button class="secondary full" name="action" value="attachment">Файл хавсаргах</button>
</form>
