{% if activity.gate0_file %}
  <small>Gate 0</small>
  <a class="attachment-link" href="{% url 'download_gate0_file' activity.gate0_file.pk %}">&#128206; {{ activity.gate0_file.original_filename }}</a>
{% elif activity.attachment %}
  <small>{{ activity.get_attachment_stage_display }}</small>
  <a class="attachment-link" href="{% url 'download_attachment' activity.pk %}">&#128206; {{ activity.attachment_name }}</a>
{% endif %}
